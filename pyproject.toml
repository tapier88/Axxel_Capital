[project]
name = "mql5-mcp-ea"
version = "0.1.0"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]


[project.optional-dependencies]
track-b-v2 = ["psutil==7.2.2"]
data-engine = [
  "numpy==2.2.6",
  "pandas==2.3.3",
  "pyarrow==23.0.0",
  "pandera[pandas]==0.29.0",
  "duckdb==1.4.4"
]
market-data = [
  "MetaTrader5>=5.0.5430",
  "numpy>=2.0",
  "pandas>=2.3",
  "pyarrow>=23"
]
ml = [
  "numpy>=2.0,<2.3",
  "pandas>=2.3,<3",
  "pyarrow>=23",
  "scikit-learn>=1.8,<2",
  "xgboost>=3.2,<4",
  "lightgbm>=4.7,<5",
  "catboost>=1.2.10,<2"
]
